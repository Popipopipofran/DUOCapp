<ion-header>
  <ion-toolbar>
    <ion-title>Mis Datos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="custom-image">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Información de Usuario</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="user.firstName" (ngModelChange)="cambiarNombre($event)"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Apellido</ion-label>
        <ion-input [(ngModel)]="user.lastName" (ngModelChange)="cambiarApellido($event)"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Correo</ion-label>
        <ion-input [(ngModel)]="user.email" (ngModelChange)="cambiarCorreo($event)"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Dirección</ion-label>
        <ion-input [(ngModel)]="user.address"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Nivel educacional</ion-label>
       <!-- <ion-input [value]="user.educationalLevel" disabled></ion-input> -->
        <ion-input type="text" disabled >{{ user.educationalLevel }}</ion-input> 
      </ion-item>

      <!-- contraseña actual
      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="user.password"></ion-input>
      </ion-item>
      -->
      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="password1"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Repetir Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="password2"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Fecha de Nacimiento</ion-label>
        <ion-input type="text" disabled >{{ user.dateOfBirth | date:'dd-MM-yyyy' }}</ion-input> <!-- Fecha en formato dd-mm-yyyy -->
      </ion-item>

      <ion-button expand="full" (click)="actualizarDatos()">Actualizar</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
