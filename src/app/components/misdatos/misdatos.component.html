<ion-content>

  <ion-grid style="text-align: center;" fixed *ngIf="user" class="user-content">
    <ion-row>
      <ion-col size="5">nombre de usuario</ion-col>
      <ion-col size="7">{{ user.userName }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="5">email</ion-col>
      <ion-col size="7">{{ user.email }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="5">nombre</ion-col>
      <ion-col size="7">{{ user.firstName }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="5">apellido</ion-col>
      <ion-col size="7">{{ user.lastName }}</ion-col>
    </ion-row>
        
    <ion-row>
      <ion-col size="5">Nivel educacional</ion-col>
      <ion-col size="7">{{ user.educationalLevel.name }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="5">fecha de nacimiento</ion-col>
      <ion-col size="7">{{ user.dateOfBirth | date:'dd-MM-yyyy' }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="5">direccion</ion-col>
      <ion-col size="7">{{ user.address }}</ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
